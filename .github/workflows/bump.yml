# Keeps Formula/delta.rb on Delta's latest release: hourly (and on demand) it
# reads zeapsu/Delta's latest release, and if the formula points elsewhere it
# updates url + sha256, builds and tests the formula on macOS, then pushes.
# Delta is public, so the default token is enough: no secrets to set up.
name: Bump Delta

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Point the formula at the latest release
        id: bump
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/zeapsu/Delta/releases/latest --jq .tag_name)
          url="https://github.com/zeapsu/Delta/archive/refs/tags/${tag}.tar.gz"
          if grep -qF "\"$url\"" Formula/delta.rb; then
            echo "Already on $tag"
            exit 0
          fi
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          sed -i '' -E "s|^  url \".*\"|  url \"$url\"|; s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/delta.rb
          # Commit now (brew taps the committed tree); push only once tested.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "delta $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and test
        if: steps.bump.outputs.tag != '' || github.event_name != 'schedule'
        run: |
          brew tap zeapsu/tap "$GITHUB_WORKSPACE"
          brew install --build-from-source zeapsu/tap/delta
          brew test zeapsu/tap/delta

      - name: Push
        if: steps.bump.outputs.tag != ''
        run: git push
